# GoReleaser config — https://goreleaser.com
# Triggered by .github/workflows/release.yml on pushed tags like v0.1.0.
version: 2

project_name: balatro-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: balatro-cli
    binary: balatro-cli
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    # Name matches what install.sh expects:
    #   balatro-cli_{version}_{os}_{arch}.tar.gz  (.zip on Windows)
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - README.zh-CN.md
      - LICENSE*
      - simple_game_rules.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: false
  prerelease: auto
